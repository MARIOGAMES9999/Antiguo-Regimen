<script>
"use strict";
/* ============================================================

   ============================================================ */
const $=s=>document.querySelector(s);
function setHTML(sel,h){const e=$(sel);if(e)e.innerHTML=h;return e;}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

// Gestor central: listas separadas por tipo
const T={iv:[],to:[],rf:[]};
function sI(f,ms){const id=setInterval(f,ms);T.iv.push(id);return id;}
function sT(f,ms){const id=setTimeout(f,ms);T.to.push(id);return id;}
// Un único "manejador" por bucle: el ID se actualiza dentro, no se añade uno por frame
function loop(fn){const h={on:true,id:0};let last=performance.now();
 function st(t){if(!h.on)return;const dt=Math.min(50,t-last)/1000;last=t;if(fn(dt)===false){h.on=false;return;}h.id=requestAnimationFrame(st);}
 h.id=requestAnimationFrame(st);T.rf.push(h);return h;}
function clearAll(){T.iv.forEach(id=>clearInterval(id));T.to.forEach(id=>clearTimeout(id));
 T.rf.forEach(h=>{h.on=false;cancelAnimationFrame(h.id);});T.iv=[];T.to=[];T.rf=[];remKey();}
let keyH=null;
function setKey(f){remKey();keyH=f;document.addEventListener('keydown',keyH);}
function remKey(){if(keyH){document.removeEventListener('keydown',keyH);keyH=null;}}

let AC=null,soundOn=true;
function beep(f=440,d=.12,type='sine',v=.15){if(!soundOn)return;try{
 if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;AC=new C();}
 if(AC.state==='suspended')AC.resume();
 const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;
 g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);
 o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d);}catch(e){}}
const sGood=()=>beep(880,.1,'triangle'),sBad=()=>beep(160,.25,'sawtooth',.12);
function sFanfare(){[523,659,784,1046].forEach((f,i)=>sT(()=>beep(f,.2,'triangle'),i*130));}

/* ============================================================
   SECCIÓN 2: ESTADO DEL JUEGO Y GUARDADO
   ============================================================ */
let S=null;
function newState(){return{n:{c:'Jacques',n:'Henri de Montclair',k:'Antoine',b:'Marie Dupont'},clero:'cura',
 ind:{h:40,d:40,i:20,p:60},t:30,f:{},diar:{c:[],n:[],k:[],b:[]},q:{c:[],n:[],k:[],b:[]},i:0,cap:0};}
const SAVE='cvur_save_v1',ENDK='cvur_finales_v1';
function save(){try{localStorage.setItem(SAVE,JSON.stringify(S));}catch(e){}}
function loadSave(){try{const r=localStorage.getItem(SAVE);return r?JSON.parse(r):null;}catch(e){return null;}}
function delSave(){try{localStorage.removeItem(SAVE);}catch(e){}}
function getEnds(){try{return JSON.parse(localStorage.getItem(ENDK)||'[]');}catch(e){return[];}}
function addEnd(id){try{const a=getEnds();if(a.indexOf(id)<0)a.push(id);localStorage.setItem(ENDK,JSON.stringify(a));return a.length;}catch(e){return 1;}}

const IND={h:'🍞 Hambre del pueblo',d:'💰 Deuda del rey',i:'💡 Ideas ilustradas',p:'🛡️ Defensa de privilegios'};
function applyFx(fx){if(!fx)return;for(const k in fx){if(k==='t')S.t=clamp(S.t+fx.t,0,100);else if(S.ind[k]!==undefined)S.ind[k]=clamp(S.ind[k]+fx[k],0,100);}drawBars();}
function fxText(fx){if(!fx)return'';const o=[];for(const k in fx){if(k==='t'){o.push('❓ algo se mueve en el reino…');continue;}
 if(IND[k]&&fx[k])o.push(IND[k]+' '+(fx[k]>0?'+':'')+fx[k]);}return o.join(' · ');}
function drawBars(){if(!S){setHTML('#bars','');return;}let h='';for(const k in IND){h+=`<div class="bar">${IND[k]}: ${S.ind[k]}<div class="tr"><div class="fi" style="width:${S.ind[k]}%"></div></div></div>`;}setHTML('#bars',h);}
function speed(extra){return 1+S.ind.h/110+(extra||0);}
const K=()=>S.clero==='obispo';
const tx=v=>typeof v==='function'?v(S):v;
const WHO={c:'🧑‍🌾',n:'🎩',k:'⛪',b:'🧵'};
function desc(w){return{c:'campesino de Champaña (Tercer Estado)',n:'noble de la corte de Versalles (Segundo Estado)',
 k:K()?'obispo, alto clero (Primer Estado)':'cura de aldea, bajo clero (Primer Estado)',b:'burguesa comerciante de Lyon (Tercer Estado)'}[w];}

const CAPS={
1:{y:'1774',t:'Luis XVI sube al trono',x:['Luis XVI, con 19 años, hereda una monarquía absoluta: el rey concentra todos los poderes por voluntad divina.','La sociedad es estamental: clero, nobleza y Tercer Estado, que agrupa a más del 95 % de la población.','Los privilegiados apenas pagan impuestos directos; el peso recae sobre campesinos y burgueses.'],fx:{}},
2:{y:'1778–1783',t:'Francia en la guerra de América',x:['Francia apoya a las Trece Colonias contra Gran Bretaña en su guerra de independencia.','La victoria cuesta una fortuna y el rey se endeuda con banqueros.','Los soldados vuelven hablando de libertad y de derechos.'],fx:{d:15,i:4}},
3:{y:'1785–1786',t:'Las Luces y la crisis financiera',x:['Montesquieu defiende la división de poderes; Rousseau, la soberanía nacional; Voltaire, la tolerancia.','La Enciclopedia de Diderot y D’Alembert difunde la razón y la crítica.','El pago de los intereses de la deuda se come buena parte de los ingresos del Estado.'],fx:{i:8,d:6}},
4:{y:'1787',t:'La Asamblea de Notables',x:['El ministro Calonne propone un impuesto sobre la tierra que pagarían también los privilegiados.','Los notables lo rechazan y Calonne cae.','El Parlamento de París se opone a los nuevos impuestos y el rey lo destierra a Troyes.'],fx:{d:5,t:4}},
5:{y:'1788',t:'Granizo, hambre y pan caro',x:['El 13 de julio de 1788 una terrible granizada arrasa las cosechas del norte de Francia.','Llega un invierno durísimo y estalla una crisis de subsistencias.','El precio del pan se dispara: en algunos lugares se lleva más de la mitad del salario.'],fx:{h:15,t:6}},
6:{y:'1789',t:'Los Estados Generales',x:['Sin dinero, el rey convoca los Estados Generales, que no se reunían desde 1614.','Sieyès pregunta: «¿Qué es el Tercer Estado? Todo. ¿Qué ha sido hasta ahora? Nada».','La gran disputa: ¿voto por estamento (uno por estamento) o voto por cabeza (uno por diputado)?'],fx:{i:5,t:5}}
};

const SC=[
/* 0 */{cap:1,w:'c',tit:'La cosecha antes de la tormenta',
 in:s=>`Verano de 1774. En tu aldea de Champaña el trigo está maduro y el cielo se oscurece. De cada espiga saldrán el pan de tu familia… y los impuestos.`,
 g:'cesta',cfg:{good:['🌾'],bad:['🪨'],ins:'Mueve la cesta con el ratón, el dedo o las flechas ← → y recoge las espigas 🌾. ¡Evita las piedras 🪨!'},
 ok:{h:-4},ko:{h:4,t:2},
 op:[{t:'Entregar todo lo que se debe: rentas, diezmo y talla.',fx:{p:3,h:3},d:'He entregado lo que pedían. Este invierno comeremos poco.',q:'Pagamos rentas al señor, diezmo a la Iglesia y talla al rey, y apenas nos queda para el pan.'},
     {t:'Esconder dos sacos de grano bajo el pajar.',f:'hid',fx:{h:-3,t:4},d:'He escondido dos sacos bajo el pajar. Si me descubren…',q:'Nos vemos obligados a esconder el grano para no morir de hambre.'}]},
/* 1 */{cap:1,w:'n',tit:'El protocolo de Versalles',
 in:s=>`Versalles brilla con el nuevo rey. Tu lugar en la corte depende de dominar la etiqueta: un gesto en falso y caerás en desgracia ante la reina María Antonieta.`,
 g:'simon',cfg:{b:['🙇 Reverencia','🎩 Sombrero','🤚 Besamanos','🚶 Paso atrás'],ins:'Observa la secuencia de gestos del protocolo y repítela en el mismo orden. Tres rondas cada vez más largas.'},
 ok:{p:3},ko:{p:-2},
 op:[{t:'Subir las rentas de tus campesinos de Champaña: Versalles es caro.',f:'rentas',fx:{h:6,p:4,t:6},d:'He ordenado subir las rentas de mis tierras de Champaña.',q:'Exigimos que se respeten nuestros derechos señoriales, antiguos y legítimos.'},
     {t:'Mantener las rentas y vender un cuadro para pagar tus deudas.',fx:{p:-1},d:'He vendido un cuadro antes que apretar a mis campesinos.',q:'Pedimos que la nobleza conserve sus honores, pero estamos dispuestos a escuchar.'}]},
/* 2 */{cap:1,w:'k',tit:'El cálculo del diezmo',
 in:s=>K()?`Desde tu palacio episcopal revisas las cuentas: el diezmo, la décima parte de la cosecha, sostiene tu diócesis… y tu carroza.`:`En tu humilde parroquia toca calcular el diezmo. Tú apenas recibes una pequeña parte, la porción congrua; el resto va al obispo y al cabildo.`,
 g:'calc',cfg:{kind:'diezmo',ins:'Responde 5 preguntas de cálculo rápido sobre el diezmo (10 %) y los precios. Elige la opción correcta.'},

 op:[{t:s=>K()?'Exigir el diezmo íntegro a todos.':'Cobrar el diezmo completo, como manda el obispo.',fx:{h:4,p:4,t:4},d:'He cobrado el diezmo entero. Es la ley de la Iglesia.',q:s=>K()?'La Iglesia debe conservar sus bienes y su exención fiscal.':'El diezmo es necesario, pero apenas llega a los curas pobres.'},
     {t:'Perdonar el diezmo a la viuda Thérèse, que no puede pagar.',f:'perdona',fx:{h:-3,p:-2,t:-3},d:'He perdonado el diezmo a la viuda. La caridad es lo primero.',q:'Pedimos que el diezmo se destine a los pobres y a los curas de aldea.'}]},
/* 3 */{cap:1,w:'b',tit:'La tienda de sedas',

 ok:{d:-2,i:1},ko:{t:1},

     {t:'Guardar el dinero para ampliar el negocio.',fx:{i:1},d:'He ahorrado para comprar más telares.',q:'Pedimos que se supriman las aduanas interiores que frenan el comercio.'}]},
/* 4 */{cap:2,w:'c',tit:'Los tres recaudadores',

 g:'escondite',boost:s=>(s.f.rentas?.3:0)+(s.f.hid?.2:0),cfg:{item:'💰',ins:'Van apareciendo sacos 💰 por el campo. Púlsalos o arrástralos rápido para llevarlos al pajar antes de que los vea el recaudador.'},
 ok:{h:-4},ko:{h:5,t:3},
 op:[{t:'Cumplir la corvea: trabajar gratis en el camino del señor.',fx:{h:2,p:2},d:'Tres días de corvea arreglando el camino del señor. Mi campo, abandonado.',q:'Pedimos la abolición de la corvea y de los derechos señoriales.'},
     {t:'Protestar con los vecinos en la plaza.',fx:{t:5},d:'Hemos gritado contra los recaudadores en la plaza.',q:'No podemos pagar a tres señores a la vez.'},
     {t:s=>`Confiar tus quejas al padre ${s.n.k}, que perdonó el diezmo a la viuda.`,show:s=>!!s.f.perdona,f:'queja',fx:{t:-2,i:3},d:'El cura me escuchó y anotó mis quejas. Por fin alguien nos oye.',q:'Nuestro cura conoce bien nuestra miseria y puede hablar por nosotros.'}]},

     {t:'Ampliar tu coto de caza y prohibir a los campesinos cazar los animales que destrozan sus campos.',f:'coto',fx:{h:4,p:4,t:5},d:'He ampliado el coto. La caza es un privilegio de mi sangre.',q:'La caza es derecho exclusivo de la nobleza y así debe seguir.'}]},
/* 6 */{cap:2,w:'k',tit:'El sermón del domingo',
 in:s=>(s.f.enciclo?`Algo ha cambiado: entre tus fieles circulan frases de la Enciclopedia llegadas de Lyon. Alguien pregunta si el rey gobierna por derecho divino. `:'')+(K()?'Predicas en la catedral ante nobles y canónigos.':'Predicas en tu pequeña iglesia ante campesinos cansados.'),
 g:'simon',cfg:{b:['✝️ Santiguarse','📖 Leer','🙏 Rezar','🔔 Campana'],ins:'Memoriza la secuencia de gestos de la misa y repítela. Tres rondas crecientes.'},
 ok:{p:2},ko:{i:2},

/* ============================================================
   SECCIÓN 4: INTERFAZ Y FLUJO DE ESCENAS
   ============================================================ */
function show(h){clearAll();setHTML('#main','<div class="card">'+h+'</div>');window.scrollTo(0,0);}
function on(sel,f){const e=$(sel);if(e)e.addEventListener('click',()=>{beep(600,.05);f();});}

function menu(){S=null;drawBars();const sv=loadSave();const n=getEnds().length;
 show(`<div class="emoji">👑🧑‍🌾🎩⛪🧵</div><h2 class="center">Cuatro Vidas, Un Reino<br><small>Rumbo a 1789</small></h2>
 <p class="center">Francia, 1774. Vas a vivir cuatro vidas a la vez. Tus decisiones cambiarán el destino del reino.</p>
 <button class="big prim" id="mNew">▶️ Nueva partida</button>
 ${sv?'<button class="big" id="mCont">⏩ Continuar partida</button>':''}
 <button class="big" id="mGlos">📖 Glosario</button>
 <p class="center small">Finales descubiertos: ${n}/7</p>`);
 on('#mNew',create);on('#mGlos',glossary);if(sv)on('#mCont',()=>{S=sv;drawBars();next();});}

function create(){S=newState();
 show(`<h2>Crea tus personajes</h2>
 <label>🧑‍🌾 Campesino de Champaña (Tercer Estado)</label><input id="nc" value="${S.n.c}" maxlength="25">
 <label>🎩 Noble de la corte de Versalles (Segundo Estado)</label><input id="nn" value="${S.n.n}" maxlength="25">
 <label>⛪ Clérigo (Primer Estado)</label><input id="nk" value="${S.n.k}" maxlength="25">
 <select id="ck"><option value="cura">Cura de aldea: bajo clero, pobre, cercano al pueblo</option><option value="obispo">Obispo: alto clero, rico, cercano a la nobleza</option></select>
 <label>🧵 Burguesa comerciante de Lyon (Tercer Estado)</label><input id="nb" value="${S.n.b}" maxlength="25">
 <button class="big prim" id="go">⚜️ Comenzar la historia</button>`);
 on('#go',()=>{const g=(id,d)=>{const e=$(id);const v=e?e.value.trim().replace(/[<>&"]/g,''):'';return v||d;};
  S.n.c=g('#nc','Jacques');S.n.n=g('#nn','Henri de Montclair');S.n.k=g('#nk','Antoine');S.n.b=g('#nb','Marie Dupont');
  const c=$('#ck');S.clero=c?c.value:'cura';delSave();drawBars();next();});}

function next(){if(!S)return menu();const sc=SC[S.i];if(!sc)return finale1();
 if(sc.cap!==S.cap)return chapter(sc.cap);banner(sc);}

function chapter(c){const C=CAPS[c];S.cap=c;applyFx(C.fx);save();
 show(`<p class="center small">Capítulo ${c} de 6</p><div class="banner">${C.y}</div><h2 class="center">${C.t}</h2>
 ${C.x.map(x=>'<p>📜 '+x+'</p>').join('')}<p class="fx center">${fxText(C.fx)}</p><button class="big prim" id="go">Continuar ➜</button>`);
 sFanfare();on('#go',()=>banner(SC[S.i]));}

function banner(sc){show(`<div class="emoji">${WHO[sc.w]}</div><div class="banner">Ahora eres ${S.n[sc.w]}</div><p class="center">${desc(sc.w)}</p>`);
 beep(392,.2,'triangle');sT(()=>intro(sc),1700);}

function intro(sc){show(`<div class="emoji">${WHO[sc.w]}</div><h2>${sc.tit}</h2><p>${tx(sc.in)}</p>
 <h3>🎮 Minijuego</h3><p>${sc.cfg.ins}</p><button class="big prim" id="go">¡A la acción!</button>`);
 on('#go',()=>{const sp=speed(sc.boost?sc.boost(S):0);GAMES[sc.g](sc.cfg,sp,pct=>result(sc,pct));});}

function result(sc,pct){clearAll();pct=clamp(Math.round(pct),0,100);const ok=pct>=60;const fx=ok?sc.ok:sc.ko;applyFx(fx);
 ok?sFanfare():sBad();
 show(`<div class="emoji">${ok?'🏆':'💥'}</div><h2 class="center">${ok?'¡Éxito!':'¡Fracaso!'} ${pct} %</h2>
 <p class="fx center">${fxText(fx)||'Sin cambios'}</p><button class="big prim" id="go">Tomar una decisión ➜</button>`);
 on('#go',()=>decide(sc));}

function decide(sc){const ops=sc.op.filter(o=>!o.show||o.show(S));
 show(`<div class="emoji">${WHO[sc.w]}</div><h2>¿Qué hace ${S.n[sc.w]}?</h2>${ops.map((o,i)=>`<button class="big" data-i="${i}">${tx(o.t)}</button>`).join('')}`);
 document.querySelectorAll('[data-i]').forEach(b=>b.addEventListener('click',()=>{beep(520,.08);const o=ops[+b.dataset.i];
  const fx=tx(o.fx);applyFx(fx);const f=tx(o.f);if(f)S.f[f]=true;
  S.diar[sc.w].push(`(${CAPS[sc.cap].y}) ${tx(o.d)}`);S.q[sc.w].push(tx(o.q));S.i++;save();
  show(`<h2>Decisión tomada</h2><p class="hand">${tx(o.d)}</p><p class="fx">${fxText(fx)}</p><button class="big prim" id="go">Continuar ➜</button>`);
  on('#go',()=>{if(Math.random()<.4&&S.i<SC.length)evt();else next();});}));}

function evt(){const e=pick(EVENTS);applyFx(e.fx);save();
 show(`<p class="small center">Mientras tanto, en Francia…</p><h2 class="center">📰 ${e.t}</h2><p>${e.x}</p><p class="fx center">${fxText(e.fx)}</p><button class="big prim" id="go">Continuar ➜</button>`);
 beep(300,.3,'square',.08);on('#go',next);}

function modal(h){const m=document.createElement('div');m.className='modal';m.innerHTML='<div class="card">'+h+'<button class="big prim" id="mx">Cerrar</button></div>';
 document.body.appendChild(m);const x=m.querySelector('#mx');if(x)x.addEventListener('click',()=>m.remove());m.addEventListener('click',e=>{if(e.target===m)m.remove();});}
function diaries(){if(!S){modal('<h2>📔 Diarios</h2><p>Empieza una partida para que tus personajes escriban.</p>');return;}
 let h='<h2>📔 Diarios</h2>';['c','n','k','b'].forEach(w=>{h+=`<h3>${WHO[w]} ${S.n[w]}</h3>`+(S.diar[w].length?S.diar[w].map(d=>`<div class="hand">${d}</div>`).join(''):'<p class="small">Aún no ha escrito nada.</p>');});modal(h);}
function glossary(){modal('<h2>📖 Glosario</h2>'+GLOS.map(g=>`<p><b>${g[0]}:</b> ${g[1]}</p>`).join(''));}

/* ============================================================
   SECCIÓN 5: MINIJUEGOS
   ============================================================ */
function gameFrame(extra){setHTML('#main',`<div class="card"><div class="hud"><span id="sc">Puntos: 0</span><span id="tm"></span></div>${extra}</div>`);}
function setTxt(id,t){const e=$(id);if(e)e.textContent=t;}
function countdown(sec,end){let left=sec;setTxt('#tm','⏱ '+left);const id=sI(()=>{left--;setTxt('#tm','⏱ '+Math.max(0,left));if(left<=0){clearInterval(id);end();}},1000);}

const GAMES={
/* 1. REFLEJOS */
reflejos(cfg,sp,done){gameFrame('<div class="arena" id="ar"></div>');const ar=$('#ar');let sc=0,goodN=0,fin=false;
 const spawn=()=>{if(fin||!ar)return;const good=Math.random()<.7;if(good)goodN++;const e=document.createElement('div');e.className='tap';
  e.textContent=good?pick(cfg.good):pick(cfg.bad);e.style.left=rnd(10,90)+'%';e.style.top=rnd(12,88)+'%';ar.appendChild(e);
  e.addEventListener('pointerdown',ev=>{ev.preventDefault();if(fin)return;if(good){sc++;sGood();}else{sc-=2;sBad();}setTxt('#sc','Puntos: '+sc);e.remove();});
  sT(()=>e.remove(),Math.max(800,2000/sp));};
 sI(spawn,Math.max(300,700/sp));
 countdown(20,()=>{fin=true;done(goodN?sc/goodN*100/0.8:0);});},

/* 2. CESTA */
cesta(cfg,sp,done){gameFrame('<div class="arena" id="ar"><div class="it" id="bk" style="font-size:46px">🧺</div></div>');
 const ar=$('#ar'),bk=$('#bk');if(!ar||!bk)return;let W=ar.clientWidth,H=ar.clientHeight,bx=W/2,sc=0,goodN=0,items=[],dir=0,fin=false;
 bk.style.top=(H-28)+'px';
 const mv=e=>{const r=ar.getBoundingClientRect();bx=clamp(e.clientX-r.left,20,W-20);};
 ar.addEventListener('pointermove',mv);ar.addEventListener('pointerdown',mv);
 setKey(e=>{if(e.key==='ArrowLeft'){dir=-1;e.preventDefault();}if(e.key==='ArrowRight'){dir=1;e.preventDefault();}});
 const ku=e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight')dir=0;};document.addEventListener('keyup',ku);
 sI(()=>{if(fin)return;const good=Math.random()<.68;if(good)goodN++;const el=document.createElement('div');el.className='it';el.textContent=good?pick(cfg.good):pick(cfg.bad);
  ar.appendChild(el);items.push({el,x:rnd(20,W-20),y:-20,v:(110+Math.random()*70)*sp,good});},Math.max(280,650/sp));
 loop(dt=>{if(fin)return false;bx=clamp(bx+dir*420*dt,20,W-20);bk.style.left=bx+'px';
  items=items.filter(o=>{o.y+=o.v*dt;o.el.style.left=o.x+'px';o.el.style.top=o.y+'px';
   if(o.y>H-50&&o.y<H-10&&Math.abs(o.x-bx)<38){if(o.good){sc++;sGood();}else{sc-=2;sBad();}setTxt('#sc','Puntos: '+sc);o.el.remove();return false;}
   if(o.y>H+20){o.el.remove();return false;}return true;});});
 countdown(20,()=>{fin=true;document.removeEventListener('keyup',ku);done(goodN?sc/goodN*100/0.75:0);});},

/* 3. RITMO (MINUÉ) */
ritmo(cfg,sp,done){gameFrame('<div class="arena" id="ar"><div class="zone"></div><div class="lanesep" style="left:25%"></div><div class="lanesep" style="left:50%"></div><div class="lanesep" style="left:75%"></div></div><div class="lanes"><button data-l="0">A</button><button data-l="1">S</button><button data-l="2">D</button><button data-l="3">F</button></div>');
 const ar=$('#ar');if(!ar)return;const H=ar.clientHeight,zt=H-56,zb=H-12;let notes=[],hits=0,total=0,fin=false;const tones=[392,440,494,523];
 const hit=l=>{if(fin)return;const n=notes.find(o=>o.l===l&&o.y>=zt-10&&o.y<=zb+10);if(n){hits++;beep(tones[l],.15,'triangle');n.el.remove();notes=notes.filter(o=>o!==n);setTxt('#sc','Aciertos: '+hits);}else beep(120,.08,'square',.05);};
 document.querySelectorAll('[data-l]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();hit(+b.dataset.l);}));
 setKey(e=>{const m={a:0,s:1,d:2,f:3}[e.key.toLowerCase()];if(m!==undefined)hit(m);});
 sI(()=>{if(fin)return;total++;const l=rnd(0,3);const el=document.createElement('div');el.className='it';el.textContent='🎵';el.style.left=(12.5+l*25)+'%';ar.appendChild(el);notes.push({el,l,y:-20});},Math.max(380,800/sp));
 loop(dt=>{if(fin)return false;notes=notes.filter(o=>{o.y+=170*sp*dt;o.el.style.top=o.y+'px';if(o.y>H+20){o.el.remove();return false;}return true;});});
 countdown(20,()=>{fin=true;done(total?hits/total*100/0.85:0);});},

/* 4. MEMORIA (SIMON) */
simon(cfg,sp,done){const tones=[330,415,494,587];
 setHTML('#main',`<div class="card"><div class="hud"><span id="sc">Ronda 1/3</span><span id="tm">Observa…</span></div><div class="simon">${cfg.b.map((b,i)=>`<button data-s="${i}">${b}</button>`).join('')}</div></div>`);
 const btn=[...document.querySelectorAll('[data-s]')];let round=0,passed=0,seq=[],pos=0,input=false;const lens=[3,4,5].map(l=>l+(sp>1.6?1:0));
 const lite=i=>{const b=btn[i];if(!b)return;b.classList.add('lit');beep(tones[i],.25,'triangle');sT(()=>b.classList.remove('lit'),300);};
 const play=()=>{input=false;setTxt('#tm','Observa…');setTxt('#sc',`Ronda ${round+1}/3`);seq=[];for(let k=0;k<lens[round];k++)seq.push(rnd(0,3));pos=0;
  const gap=Math.max(380,650/sp);seq.forEach((s,k)=>sT(()=>lite(s),600+k*gap));sT(()=>{input=true;setTxt('#tm','¡Tu turno!');},600+seq.length*gap);};
 const endRound=ok=>{input=false;if(ok){passed++;sFanfare();}else sBad();round++;if(round>=3)sT(()=>done(passed/3*100),700);else sT(play,900);};
 btn.forEach((b,i)=>b.addEventListener('pointerdown',e=>{e.preventDefault();if(!input)return;lite(i);if(seq[pos]===i){pos++;if(pos>=seq.length)endRound(true);}else endRound(false);}));
 play();},

/* 5. CÁLCULO RÁPIDO */
calc(cfg,sp,done){const qs=[];for(let k=0;k<5;k++)qs.push(makeQ(cfg.kind,k));let qi=0,ok=0;const lim=Math.max(5,Math.round(9/sp));
 const ask=()=>{clearAll();if(qi>=5)return done(ok/5*100);const q=qs[qi];
  setHTML('#main',`<div class="card"><div class="hud"><span id="sc">Pregunta ${qi+1}/5 · Aciertos: ${ok}</span><span id="tm"></span></div><p><b>${q.t}</b></p><div class="opts">${q.o.map(v=>`<button data-v="${v}">${v}</button>`).join('')}</div></div>`);
  document.querySelectorAll('[data-v]').forEach(b=>b.addEventListener('click',()=>{if(+b.dataset.v===q.a){ok++;sGood();}else sBad();qi++;ask();}));
  countdown(lim,()=>{sBad();qi++;ask();});};ask();},

/* 6. COMERCIO COLONIAL */
comercio(cfg,sp,done){let v=0,ok=0;const places=['Burdeos → Saint-Domingue','Nantes → Martinica','Marsella → Levante','Lyon → Cádiz','Le Havre → Guadalupe','Lyon → Génova'];
 const trip=()=>{clearAll();if(v>=3)return done(ok/3*100);
  let r;do{r=shuffle(places.slice()).slice(0,3).map(n=>{const c=rnd(10,40)*10;return{n,c,s:c+rnd(5,30)*10,p:false};});r[rnd(0,2)].p=true;}
  while(new Set(r.map(x=>x.s-x.c)).size<3);
  const safe=r.filter(x=>!x.p);const best=safe.reduce((a,b)=>(b.s-b.c)>(a.s-a.c)?b:a);
  setHTML('#main',`<div class="card"><div class="hud"><span>Viaje ${v+1}/3 · Aciertos: ${ok}</span><span id="tm"></span></div><div class="timer" id="tb" style="width:100%"></div>
  ${r.map((x,i)=>`<button class="route" data-r="${i}">⛵ ${x.n}<br>Compra: ${x.c} libras · Venta: ${x.s} libras ${x.p?'· ☠️ <b>¡Piratas avistados!</b>':''}</button>`).join('')}</div>`);
  document.querySelectorAll('[data-r]').forEach(b=>b.addEventListener('click',()=>{const x=r[+b.dataset.r];if(x===best){ok++;sGood();}else sBad();v++;trip();}));
  const tot=10;let t0=performance.now();loop(()=>{const el=(performance.now()-t0)/1000;const tb=$('#tb');if(tb)tb.style.width=Math.max(0,100-el/tot*100)+'%';setTxt('#tm','⏱ '+Math.max(0,Math.ceil(tot-el)));if(el>=tot){sBad();v++;sT(trip,0);return false;}});};
 trip();},

/* 7. ESCONDITE */
escondite(cfg,sp,done){gameFrame(`<div class="arena" id="ar"><div class="it" id="barn" style="left:88%;top:50%;font-size:52px">${cfg.item==='📚'?'🧳':'🛖'}</div><div class="it" id="rec" style="left:5%;top:10%;font-size:38px">🕵️</div></div>`);
 const ar=$('#ar');if(!ar)return;const N=10;let made=0,hid=0,fin=false;
 const stash=e=>{if(fin||e.dataset.done)return;e.dataset.done='1';hid++;sGood();setTxt('#sc',`Escondidos: ${hid}/${N}`);e.style.transition='all .3s';e.style.left='88%';e.style.top='50%';e.style.opacity='0';sT(()=>e.remove(),320);};
 const spawn=()=>{if(fin)return;if(made>=N)return;made++;const e=document.createElement('div');e.className='tap';e.textContent=cfg.item;
  e.style.left=rnd(8,70)+'%';e.style.top=rnd(15,85)+'%';ar.appendChild(e);
  let sx=0,sy=0;e.addEventListener('pointerdown',ev=>{ev.preventDefault();sx=ev.clientX;sy=ev.clientY;stash(e);});
  sT(()=>{if(!e.dataset.done&&!fin){e.dataset.done='1';sBad();e.textContent='❌';sT(()=>e.remove(),300);}},Math.max(700,1600/sp));};
 sI(spawn,Math.max(450,900/sp));
 const rec=$('#rec');let rx=5;loop(dt=>{if(fin)return false;rx=Math.min(80,rx+dt*7*sp);if(rec)rec.style.left=rx+'%';});
 setTxt('#sc',`Escondidos: 0/${N}`);
 countdown(Math.ceil(N*Math.max(450,900/sp)/1000)+2,()=>{fin=true;done(hid/N*100);});}
};

function opts(a){const s=new Set([a]);let g=0;while(s.size<3&&g<100){g++;const d=rnd(1,Math.max(3,Math.round(a*.3)))*(Math.random()<.5?-1:1);if(a+d>0)s.add(a+d);}
 let k=1;while(s.size<3){s.add(a+k*7);k++;}return shuffle([...s]);}
function makeQ(kind,k){let t,a;const ty=kind==='diezmo'?[0,0,1,2,0][k]:kind==='precios'?[1,2,0,1,2][k]:[3,3,1,3,2][k];
 if(ty===0){const q=rnd(5,40)*10;a=q/10;t=`Una cosecha de ${q} sacos. ¿Cuántos sacos son el diezmo (10 %)?`;}
 else if(ty===1){const p=rnd(2,9),n=rnd(3,12);a=p*n;t=`Una hogaza cuesta ${p} sueldos. ¿Cuánto cuestan ${n} hogazas?`;}
 else if(ty===2){const per=rnd(2,6),f=rnd(3,9);a=per;t=`Hay ${per*f} panes para ${f} familias. ¿Cuántos panes recibe cada familia?`;}
 else{const p=rnd(2,9)*10,pc=pick([10,20,50]);a=p+p*pc/100;t=`El pan costaba ${p} céntimos y sube un ${pc} %. ¿Cuánto cuesta ahora?`;}
 return{t,a,o:opts(a)};}

/* ============================================================
   SECCIÓN 6: FINAL
   ============================================================ */
const ENDS={
rev:{t:'La Revolución francesa',e:'🗽',x:'El Tercer Estado se proclama Asamblea Nacional (17 de junio). En el Juramento del Juego de Pelota (20 de junio) promete no separarse hasta dar una constitución a Francia. El 14 de julio el pueblo de París toma la Bastilla. En agosto se abolen los privilegios y se aprueba la Declaración de los Derechos del Hombre y del Ciudadano. El absolutismo ha terminado.',r:'¡Coincide con la historia! Así ocurrió en 1789.'},
ham:{t:'La revolución del hambre',e:'🔥',x:'Los motines se extienden por todo el reino: se asaltan graneros y castillos. Pero sin ideas ilustradas ni líderes con un proyecto político, la revuelta no construye un nuevo régimen y el caos se impone.',r:'En la realidad el hambre fue la chispa, pero las ideas ilustradas y la burguesía dieron a la revolución un proyecto político.'},
ref:{t:'Reforma pacífica: monarquía constitucional',e:'⚖️',x:'Los privilegiados aceptan pagar impuestos y el rey acepta una constitución que divide los poderes, como proponía Montesquieu. Francia se convierte en monarquía constitucional sin derramar sangre.',r:'En la realidad los privilegiados se negaron a perder sus exenciones y la reforma pactada fracasó. Francia probó una monarquía constitucional (1791), pero tras la revolución.'},
banc:{t:'La bancarrota del Estado',e:'💸',x:'El Tesoro ya no puede pagar ni los intereses. Los banqueros dejan de prestar, los soldados no cobran y el Estado se hunde en el caos financiero.',r:'En la realidad la deuda fue una causa clave: obligó al rey a convocar los Estados Generales, que acabaron desembocando en la revolución.'},
apl:{t:'La revuelta campesina aplastada',e:'⚔️',x:'Los campesinos se alzan, pero el ejército del rey y de los señores, unidos para defender sus privilegios, sofoca la revuelta. Los cabecillas son ahorcados.',r:'En la realidad el ejército dudó, muchos soldados simpatizaban con el pueblo, y el rey no logró controlar París en julio de 1789.'},
desp:{t:'El despotismo ilustrado',e:'👑',x:'El rey se rodea de ministros ilustrados y reforma el reino desde arriba: «todo para el pueblo, pero sin el pueblo». Hay mejoras, pero nadie vota.',r:'Este modelo se dio en Prusia, Austria o la España de Carlos III; en Francia los intentos de Turgot o Calonne fracasaron ante los privilegiados.'},
abs:{t:'El absolutismo resiste',e:'🏰',x:'El rey disuelve los Estados Generales y todo sigue igual: estamentos, privilegios y monarquía absoluta. Por ahora.',r:'En la realidad el Antiguo Régimen ya no podía sostenerse: deuda, hambre e ideas nuevas lo derribaron en 1789.'}
};
const END_ORDER=['rev','ham','ref','banc','apl','desp','abs'];

function prob(){const I=S.ind,f=S.f;let p=-5+I.h*.25+I.d*.2+I.i*.2+I.p*.15+S.t*.15;
 if(f.rechazo)p+=8;if(f.porCabeza)p+=8;if(f.motin)p+=6;if(f.motinPrevio)p+=3;if(f.especula)p+=5;if(f.protesta)p+=3;if(f.uneTercer)p+=4;
 if(f.reformaNoble)p-=10;if(f.iglesiaPaga)p-=8;if(f.graneros)p-=5;if(f.liberal)p-=3;return clamp(Math.round(p),5,95);}
function chooseEnd(roll,p){const I=S.ind,f=S.f;
 if(roll<=p)return I.i>=45?'rev':'ham';
 if(I.d>=85)return'banc';
 if((f.motin||f.motinPrevio)&&I.p>=55)return'apl';
 if((f.reformaNoble||f.iglesiaPaga)&&I.i>=50)return'ref';
 if(I.i>=45)return'desp';return'abs';}

function finale1(){delSave();
 show(`<div class="emoji">🏛️</div><h2 class="center">5 de mayo de 1789</h2><p class="center">En Versalles se reúnen los Estados Generales. Unos 1.200 diputados: el clero de negro y oro, la nobleza con plumas y encajes, el Tercer Estado vestido de negro sencillo. Cada estamento trae sus cuadernos de quejas.</p><button class="big prim" id="go">Leer los cuadernos de quejas ➜</button>`);
 sFanfare();on('#go',finale2);}
function finale2(){let h='<h2>📜 Cuadernos de quejas</h2>';
 ['c','n','k','b'].forEach(w=>{const est={c:'Tercer Estado (campesinos)',n:'Nobleza',k:'Clero',b:'Tercer Estado (burguesía)'}[w];
  h+=`<h3>${WHO[w]} ${S.n[w]} — ${est}</h3><div class="hand">Señor: nosotros, fieles súbditos de Vuestra Majestad, humildemente exponemos: ${S.q[w].join(' ')} Firmado: ${S.n[w]}.</div>`;});
 show(h+'<button class="big prim" id="go">Revelar la tensión social ➜</button>');on('#go',finale3);}
function finale3(){const p=prob();
 show(`<h2 class="center">🌡️ Tensión social oculta</h2><div class="bar">Tensión: ${S.t}/100<div class="tr"><div class="fi" style="width:${S.t}%"></div></div></div>
 <p>${S.t>=70?'El reino es un polvorín.':S.t>=45?'El descontento es profundo.':'El reino está inquieto, pero contenido.'}</p>
 <h2 class="center">Tus decisiones dieron un ${p} % de probabilidad de revolución</h2><p class="center">Si el dado saca ${p} o menos, estallará la revolución.</p>
 <div class="dice" id="dice">🎲</div><button class="big prim" id="go">🎲 Lanzar el dado</button>`);
 on('#go',()=>{const b=$('#go');if(b)b.remove();const d=$('#dice');if(d)d.classList.add('spin');const roll=rnd(1,100);let n=0;
  const id=sI(()=>{n++;setTxt('#dice',rnd(1,100));beep(200+rnd(0,400),.04,'square',.06);if(n>=25){clearInterval(id);if(d)d.classList.remove('spin');setTxt('#dice',roll);
   const e=chooseEnd(roll,p);sT(()=>finale4(e,roll,p),1200);}},80);});}
function finale4(id,roll,p){const E=ENDS[id];const n=addEnd(id);sFanfare();
 show(`<p class="center small">Dado: ${roll} · Probabilidad: ${p} %</p><div class="emoji">${E.e}</div><h2 class="center">${E.t}</h2><p>${E.x}</p>
 <p class="center"><b>Finales descubiertos: ${n}/7</b></p><button class="big prim" id="go">📚 Lo que pasó en realidad… ➜</button>`);
 on('#go',()=>finale5(id));}
function finale5(id){const E=ENDS[id];
 show(`<h2>📚 Lo que pasó en realidad…</h2><p><b>${E.r}</b></p>
 <p>La Revolución de 1789 tuvo varias causas que se sumaron. La primera fue <b>política</b>: una monarquía absoluta incapaz de reformarse. La segunda, <b>social</b>: una sociedad estamental en la que una minoría privilegiada no pagaba y una burguesía rica no tenía poder. La tercera, <b>económica</b>: la enorme deuda, agravada por la guerra de América, y la crisis de subsistencias de 1788–1789. La cuarta, <b>ideológica</b>: la Ilustración, que ofreció una alternativa basada en la soberanía nacional, la división de poderes y la igualdad ante la ley.</p>
 <p>La chispa saltó cuando los privilegiados se negaron a pagar impuestos y el Tercer Estado exigió el voto por cabeza en los Estados Generales.</p>
 <p class="small">En tu partida: hambre ${S.ind.h}, deuda ${S.ind.d}, ideas ${S.ind.i}, privilegios ${S.ind.p}, tensión ${S.t}.</p>
 <button class="big prim" id="go">Epílogo ➜</button>`);on('#go',epilogue);}
function epilogue(){const f=S.f,n=S.n;
 const c=f.motin?`${n.c} fue uno de los primeros en marchar con las multitudes; su nombre aparece en las listas de los motines de 1789.`:f.paris?`${n.c} se quedó en París y trabajó como jornalero en el barrio de Saint-Antoine, cerca de la Bastilla.`:`${n.c} siguió cultivando su tierra en Champaña, esperando que el rey leyera sus quejas.`;
 const no=f.especula?`${n.n} se enriqueció con el trigo, pero acabó odiado por el pueblo y emigró al extranjero.`:f.liberal||f.reformaNoble?`${n.n} fue uno de los nobles liberales que apoyaron las reformas y renunciaron a sus privilegios.`:`${n.n} defendió los privilegios hasta el final y vio cómo su mundo se desmoronaba.`;
 const k=f.uneTercer?`${n.k} se unió a los diputados del Tercer Estado, como hicieron muchos curas en junio de 1789.`:f.graneros||f.perdona?`${n.k} fue recordado por los pobres como un clérigo justo y caritativo.`:`${n.k} defendió los bienes y privilegios de la Iglesia ante los nuevos tiempos.`;
 const b=f.porCabeza||f.club?`${n.b} se convirtió en una voz destacada de la política de Lyon; algunas mujeres como ella reclamarían también sus derechos, como Olympe de Gouges en 1791.`:f.titulo?`${n.b} logró su cargo ennoblecedor… justo cuando los títulos empezaban a perder su valor.`:`${n.b} siguió al frente de su tienda de sedas, atenta a las noticias de París.`;
 show(`<h2>📖 Epílogo</h2><p>🧑‍🌾 ${c}</p><p>🎩 ${no}</p><p>⛪ ${k}</p><p>🧵 ${b}</p><p class="center"><b>Finales descubiertos: ${getEnds().length}/7</b></p>
 <button class="big prim" id="again">🔄 Jugar otra vez</button><button class="big" id="dg">📖 Glosario</button><button class="big" id="dd">📔 Diarios</button>`);
 on('#again',()=>{S=null;create();});on('#dg',glossary);on('#dd',diaries);}

/* ============================================================
   SECCIÓN 7: ARRANQUE
   ============================================================ */
on('#bDiar',diaries);on('#bGlos',glossary);
on('#bSnd',()=>{soundOn=!soundOn;setTxt('#bSnd',soundOn?'🔊':'🔇');});
on('#bMenu',()=>{if(!S||confirm('¿Volver al menú? La partida se guardó al terminar la última escena.'))menu();});
menu();
